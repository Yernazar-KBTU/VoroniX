# Render Blueprint: the full system (API + web CRM + PostgreSQL) on Render's free plan.
# New → Blueprint → pick this repository. Migrations run on start. Open the site,
# press "Start free" and create the first business.
#
# Free plan (https://render.com/docs/free): the site sleeps after 15 minutes without
# visitors and takes about a minute to wake up; the free database expires 30 days
# after it is created. Move to paid plans before real clients sign up.
#
# Optional settings, added later on the service's Environment page:
# APP_URL (defaults to the service's onrender.com address), ANTHROPIC_API_KEY,
# RESEND_API_KEY, MAIL_FROM, SUPPORT_EMAIL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET.
#
# VoroniX AI (our own intent model) is the second service below, built from its own
# repository https://github.com/Yernazar-KBTU/voronix-ai. Render generates its
# VORONIX_AI_KEY and copies the same key into the CRM. After the first deploy, copy
# the AI's address (https://voronix-ai-....onrender.com) into the CRM's VORONIX_AI_URL.
# From then on, if the AI does not answer, the CRM shows "VoroniX AI is DOWN" and
# the chats wait for a person (no automatic replies on old rules).
services:
  - type: web
    name: voronix
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voronix-db
          property: connectionString
      - key: VORONIX_AI_KEY
        fromService:
          name: voronix-ai
          type: web
          envVarKey: VORONIX_AI_KEY
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      # Third AI, VoroniX.ai (its own Render service from github.com/Yernazar-KBTU/VoroniX.ai):
      # its https address and the VORONIX_CRM_KEY that Render generated for it.
      - key: VORONIXAI_URL
        sync: false
      - key: VORONIXAI_KEY
        sync: false

  - type: web
    name: voronix-ai
    runtime: docker
    plan: free
    repo: https://github.com/Yernazar-KBTU/voronix-ai.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: VORONIX_AI_KEY
        generateValue: true

databases:
  - name: voronix-db
    plan: free
    databaseName: crm
    user: crm
    postgresMajorVersion: "16"
