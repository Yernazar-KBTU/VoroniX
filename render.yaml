# Render Blueprint: the full system (API + web CRM + PostgreSQL) on Render's free plan.
# New → Blueprint → pick this repository. Migrations run on start. Open the site,
# press "Start free" and create the first business.
services:
  - type: web
    name: voronix
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voronix-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: voronix-db
    plan: free
    databaseName: crm
    user: crm
    postgresMajorVersion: "16"
