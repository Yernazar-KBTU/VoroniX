# Render Blueprint: the full system (API + web CRM + PostgreSQL) on Render's free plan.
# New → Blueprint → pick this repository. Migrations run on start; load the demo salon
# from the banner on the first page.
services:
  - type: web
    name: crm-small-business
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: ALLOW_DEMO_RESET
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Optional login for the CRM pages (leave empty for an open demo).
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false

databases:
  - name: crm-db
    plan: free
    databaseName: crm
    user: crm
    postgresMajorVersion: "16"
