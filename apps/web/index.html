<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VoroniX · AI CRM</title>
  <meta name="description" content="AI CRM for appointment-based small businesses">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
</head>
<body>
  <div class="app" id="app">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <div class="main">
      <header class="top">
        <div class="brand"><span class="dot"></span><span id="bizName">VoroniX</span> <small>VoroniX</small></div>
        <label class="tsearch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="gsearch" placeholder="Search clients, phones, services"></label>
        <span class="grow"></span>
        <span class="chip ai" id="aiChip"><span class="led"></span>AI administrator</span>
        <span class="chip" id="modeChip">Connecting…</span>
        <span class="chip" id="clock"></span>
      </header>
      <div class="phead" id="phead"></div>
      <div id="banner"></div>
      <main id="view"></main>
    </div>
  </div>
  <div id="modal"></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
