<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AI CRM for small businesses: the AI administrator answers clients in Telegram, WhatsApp and Instagram using only data from the CRM database.">
<meta name="theme-color" content="#0d3a6e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230b8fd6%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22%3EAI%3C/text%3E%3C/svg%3E">
<title>VoroniX · AI CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Bitrix-style workspace. Icon rail on the left, glass header on a violet gradient, white working panels. AI is marked in violet everywhere. */
:root{
  --bg:#0d3a6e;
  --grad:radial-gradient(1200px 700px at 85% 15%,#3fd0ff55,transparent 60%),radial-gradient(900px 600px at 10% 90%,#2a6bff44,transparent 60%),linear-gradient(135deg,#0a2350 0%,#0d4f8f 50%,#0f9cc4 100%);
  --chrome:#ffffff; --chrome-dim:#cfeaff; --glass:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.26);
  --panel:#ffffff; --panel2:#f4f6fb; --line:#e2e6ef; --fg:#1d2233; --muted:#6a7186;
  --accent:#0b8fd6; --accent-soft:#e3f3fd; --green:#4fae33; --green-hi:#5cc23c;
  --red:#e3484f; --red-soft:#fdecec; --amber:#d98e04; --amber-soft:#fff4dc; --ok-soft:#e7f6e2;
  --ai:#7b4dff; --ai-soft:#f0ebff; --ai-fg:#5a2ee0;
  --tg:#2aa3e0; --wa:#25b860; --ig:#d6338a;
  --shadow:0 10px 30px rgba(8,40,60,.18);
  --sans:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#061a33; --grad:radial-gradient(1200px 700px at 85% 15%,#3fd0ff26,transparent 60%),radial-gradient(900px 600px at 10% 90%,#2a6bff26,transparent 60%),linear-gradient(135deg,#05132b 0%,#0a2a55 50%,#0b4a72 100%);
  --panel:#0f2442; --panel2:#152e52; --line:#23426b; --fg:#e4eef9; --muted:#9db4cf;
  --accent:#3fb4f0; --accent-soft:#12365a; --green:#4fae33; --green-hi:#5cc23c;
  --red:#ff6b70; --red-soft:#4a2030; --amber:#ffb84a; --amber-soft:#43361a; --ok-soft:#1f3b26;
  --ai:#9b7bff; --ai-soft:#2e2660; --ai-fg:#c3b2ff; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#061a33; --grad:radial-gradient(1200px 700px at 85% 15%,#3fd0ff26,transparent 60%),radial-gradient(900px 600px at 10% 90%,#2a6bff26,transparent 60%),linear-gradient(135deg,#05132b 0%,#0a2a55 50%,#0b4a72 100%);
  --panel:#0f2442; --panel2:#152e52; --line:#23426b; --fg:#e4eef9; --muted:#9db4cf;
  --accent:#3fb4f0; --accent-soft:#12365a; --green:#4fae33; --green-hi:#5cc23c;
  --red:#ff6b70; --red-soft:#4a2030; --amber:#ffb84a; --amber-soft:#43361a; --ok-soft:#1f3b26;
  --ai:#9b7bff; --ai-soft:#2e2660; --ai-fg:#c3b2ff; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);background-image:var(--grad);background-attachment:fixed;color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.app{display:grid;grid-template-columns:auto minmax(0,1fr);align-content:start;gap:16px;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
/* rail */
.rail{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:4px;width:56px;transition:width .18s}
.app.wide .rail{width:220px}
.rail button{position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:var(--chrome-dim);cursor:pointer;white-space:nowrap;overflow:hidden;text-align:left}
.rail button:hover{background:var(--glass);color:var(--chrome)}
.rail button.on{background:var(--glass-hi);color:var(--chrome)}
.rail svg{flex:none;width:20px;height:20px}
.rail .lbl{opacity:0;transition:opacity .15s}
.app.wide .rail .lbl{opacity:1}
.rail .sep{height:1px;background:var(--glass);margin:6px 8px}
.rail .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:18px}
.app:not(.wide) .rail .badge{position:absolute;margin:0;transform:translate(12px,-10px)}
/* top */
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--chrome)}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand small{font-weight:500;font-size:12px;color:var(--chrome-dim)}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--green-hi);box-shadow:0 0 0 3px #ffffff33}
.top .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:5px 12px;background:var(--glass);color:var(--chrome);border:1px solid #ffffff22;font-size:13px;white-space:nowrap}
.chip.ai{background:#7b4dff55;border-color:#b9a4ff55}
.chip .led{width:8px;height:8px;border-radius:50%;background:var(--green-hi)}
.chip .led.off{background:#ffb84a}
.chip.ai.down{background:#e5484d55;border-color:#ff8a8a88;font-weight:700}
.chip.ai.down .led{background:#ff4d6d}
.tsearch{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid #ffffff22;border-radius:20px;padding:5px 12px;min-width:0;flex:0 1 280px}
.tsearch input{background:transparent;border:0;outline:0;color:var(--chrome);width:100%}
.tsearch input::placeholder{color:var(--chrome-dim)}
/* page head */
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--chrome)}
.phead h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.phead .sub{color:var(--chrome-dim);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.create{background:var(--green);border-color:var(--green);color:#fff}
.btn.create:hover{background:var(--green-hi)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.ghost{background:var(--glass);border-color:#ffffff22;color:var(--chrome)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:2px;background:var(--glass);border-radius:8px;padding:3px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:var(--chrome-dim);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--glass-hi);color:var(--chrome)}
/* panels */
.panel{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.pad{padding:18px}
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ph h2,.ph h3{margin:0;font-size:15px;font-weight:600}
.ph .grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.kpi{padding:16px 18px;border-radius:14px;color:#fff;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
.kpi .k{font-size:13px;opacity:.92}
.kpi .v{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1;text-align:right}
.kpi .s{font-size:12px;opacity:.9}
.kpi.b{background:#3fa9f5}.kpi.g{background:#7fb63a}.kpi.vi{background:#7b4dff}.kpi.r{background:#f05a50}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
table.t td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--panel2)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--panel2);color:var(--muted)}
.pill.Booked{background:var(--accent-soft);color:var(--accent)}
.pill.Confirmed,.pill.Paid,.pill.Completed{background:var(--ok-soft);color:var(--green)}
.pill.Cancelled,.pill.Refunded{background:var(--panel2);color:var(--muted)}
.pill.No-show,.pill.human{background:var(--red-soft);color:var(--red)}
.pill.Pending,.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.ai{background:var(--ai-soft);color:var(--ai-fg)}
.code{font-family:var(--mono);font-size:12px}
.ms{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;color:#fff;font-size:11px;font-weight:700;flex:none}
.ms.Telegram{background:var(--tg)}.ms.WhatsApp{background:var(--wa)}.ms.Instagram{background:var(--ig)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:18px;font-weight:500;margin-bottom:6px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.time{font-family:var(--mono);font-size:12px;color:var(--muted);width:46px;flex:none}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* inbox */
.inbox{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;height:clamp(480px,calc(100vh - 190px),780px);height:clamp(480px,calc(100dvh - 190px),780px);overflow:hidden}
.convs{border-right:1px solid var(--line);overflow-y:auto;min-height:0}
.conv{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.conv:hover{background:var(--panel2)}
.conv.on{background:var(--accent-soft)}
.conv .grow{flex:1;min-width:0}
.conv .nm{font-weight:600;display:flex;gap:6px;align-items:center}
.conv .last{color:var(--muted);font-size:12.5px}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel2)}
.chead{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.chead .grow{flex:1;min-width:0}
.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;position:relative}
.m .who{font-size:11px;font-weight:700;margin-bottom:2px;letter-spacing:.02em}
.m .at{font-size:10.5px;color:var(--muted);margin-top:3px;text-align:right}
.m.client{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.ai{align-self:flex-end;background:var(--ai-soft);border:1px solid transparent;border-bottom-right-radius:4px}
.m.ai .who{color:var(--ai-fg)}
.m.admin{align-self:flex-end;background:var(--ok-soft);border-bottom-right-radius:4px}
.m.admin .who{color:var(--green)}
.m.system{align-self:center;background:transparent;color:var(--muted);font-size:12px;text-align:center;max-width:90%;padding:2px 8px}
.paycard{align-self:flex-end;background:var(--panel);border:1px solid var(--ai);border-radius:14px;padding:12px 14px;min-width:240px;max-width:78%}
.paycard .amt{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.typing{align-self:flex-end;background:var(--ai-soft);color:var(--ai-fg);border-radius:14px;padding:8px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.dots span{display:inline-block;width:6px;height:6px;margin:0 1px;border-radius:50%;background:var(--ai);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.composer .row{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel2);min-height:40px;max-height:120px}
.seg{display:inline-flex;background:var(--panel2);border-radius:8px;padding:2px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:3px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.info{border-left:1px solid var(--line);overflow-y:auto;min-height:0;padding:14px;display:flex;flex-direction:column;gap:14px}
.info h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.switch input{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--ai)}
.switch input:checked::after{left:16px}
@media (max-width:1100px){.inbox{grid-template-columns:260px minmax(0,1fr)}.info{display:none}}
@media (max-width:760px){.inbox{grid-template-columns:minmax(0,1fr);height:clamp(420px,calc(100dvh - 150px),680px)}.inbox.open .convs{display:none}.inbox:not(.open) .chat{display:none}}
/* pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:360px}
.col .hd{padding:10px 12px;border-top:4px solid var(--c);border-radius:12px 12px 0 0;font-weight:600;display:flex;justify-content:space-between}
.col .bd{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent)}
/* calendar */
.cal{display:grid;min-width:640px;position:relative}
.cal .hh{position:sticky;top:0;background:var(--panel);z-index:2;height:48px;overflow:hidden;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.cal .tm{font-family:var(--mono);font-size:11px;color:var(--muted);padding:2px 6px;border-top:1px solid var(--line);height:28px}
.cal .cell{border-top:1px solid var(--line);border-left:1px solid var(--line);height:28px;cursor:pointer}
.cal .cell:hover{background:var(--accent-soft)}
.cal .cell.half{border-top-style:dashed}
.ev{position:absolute;border-radius:8px;padding:4px 7px;font-size:12px;overflow:hidden;cursor:pointer;border-left:4px solid var(--accent);background:var(--accent-soft);color:var(--fg);line-height:1.3}
.ev.Completed{border-color:var(--green);background:var(--ok-soft)}
.ev.Confirmed{border-color:var(--ai);background:var(--ai-soft)}
.ev.No-show{border-color:var(--red);background:var(--red-soft)}
.ev.Cancelled{opacity:.45;border-color:var(--muted);background:var(--panel2)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:3;pointer-events:none}
/* kb */
.kbwrap{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.dbwrap{grid-template-columns:minmax(0,240px) minmax(0,1fr)}
@media (max-width:1100px){.kbwrap,.dbwrap{grid-template-columns:minmax(0,1fr)}}
.filebtn{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:8px;cursor:pointer;font:inherit;color:inherit}.filebtn:hover{background:var(--panel2)}.filebtn.on{background:var(--ai-soft,#efeafe);font-weight:600}.doc h2{margin:0 0 8px}.doc h3{margin:14px 0 4px;font-size:15px}.memory li{margin:2px 0}
.kbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.kbc{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.kbc:hover{border-color:var(--ai)}
.kbc p{margin:0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.answer{white-space:pre-wrap;background:var(--ai-soft);border-radius:10px;padding:10px 12px;min-height:44px}
/* forms */
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea,.inp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2);color:var(--fg);width:100%;min-width:0}
.f textarea{min-height:90px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,40,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{width:min(880px,100%)}
.modal .mb{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:transparent;cursor:pointer;font-size:20px;color:var(--muted);line-height:1}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1d2233;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;box-shadow:var(--shadow);max-width:360px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--amber-soft);color:var(--fg)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.bars div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div:hover{background:var(--ai)}
.hbar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--red)}
.sql{width:100%;min-height:120px;font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);resize:vertical}
.tbl-list{display:flex;flex-direction:column;gap:6px}
.tbl-list button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left}
.tbl-list button.on{border-color:var(--accent);background:var(--accent-soft)}
.key{font-family:var(--mono);font-size:10.5px;font-weight:700;border-radius:4px;padding:0 4px;margin-right:4px}
.key.pk{background:var(--red-soft);color:var(--red)}.key.fk{background:var(--ok-soft);color:var(--green)}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;flex-direction:row;width:auto!important;overflow-x:auto}
  .rail .lbl,.rail .sep,.rail .menu{display:none}
  .phead h1{font-size:22px}
  .kpi .v{font-size:24px;white-space:nowrap}
  .kpi{min-height:100px}
  #clock,#modeChip{display:none}
  .tsearch{flex:1 1 100%;order:3}
  .rail{scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
}
.intwrap{grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.icard{display:flex;align-items:flex-start;gap:12px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);color:var(--fg);cursor:pointer;font:inherit}
.icard:hover{border-color:var(--accent)}
.icard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.icard .ibody{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.icard .pill{flex:none}
.ilogo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.ilogo svg{width:24px;height:24px}
.ipanel{position:sticky;top:12px}
.answer.bad{background:var(--red-soft);color:var(--red)}
@media (max-width:900px){.intwrap{grid-template-columns:1fr}.ipanel{position:static}}

</div>

<div id="toast" class="toast" hidden></div>
<script src="voronix-brain.js"></script>
<script>
"use strict";
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const dt=d=>ymd(d)+" "+hm(d);
const parseDT=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)/.exec(s||"");return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5]):null};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const money=n=>(Math.round(+n||0)).toLocaleString("ru-RU").replace(/ /g," ")+" ₸";
const toMin=t=>{const [h,m]=String(t).split(":").map(Number);return h*60+(m||0)};
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const nowISO=()=>new Date().toISOString();
const fmtAt=iso=>{const d=new Date(iso);return isNaN(d)?"":(ymd(d)===ymd(new Date())?hm(d):pad(d.getDate())+"."+pad(d.getMonth()+1)+" "+hm(d))};
let toastT;function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}
const MSG_ICON={Telegram:"T",WhatsApp:"W",Instagram:"I"};
const ms=m=>`<span class="ms ${esc(m)}" title="${esc(m)}">${MSG_ICON[m]||"?"}</span>`;
const pill=(s,cls)=>`<span class="pill ${esc(cls||s)}">${esc(s)}</span>`;

/* ---------- data store (db capability, or in-memory demo) ---------- */
const COLS=["settings","services","masters","master_services","clients","client_channels","appointments","payments","conversations","knowledge"];
const S={};COLS.forEach(c=>S[c]={});
let db=null,live=false,canWrite=true,loaded=new Set();
const pending={},inflight={},deleting={};
/* Messages the VoroniX AI site answered by itself (its Live inbox and demo stream) arrive in
   localStorage "vx-ai-recent". They become test chats here, marked so they never mix with real
   clients; a booking the AI made there goes into the calendar. "vx-crm-ai-seen" keeps deleted ones deleted. */
const AI_RECENT="vx-ai-recent",AI_SEEN="vx-crm-ai-seen",MSGR={instagram:"Instagram",telegram:"Telegram",whatsapp:"WhatsApp"};
function fromAiSite(){
  if(live)return 0;let list=[],seen;try{list=JSON.parse(localStorage.getItem(AI_RECENT)||"[]");seen=new Set(JSON.parse(localStorage.getItem(AI_SEEN)||"[]"))}catch(_){return 0}
  let n=0;const low=x=>String(x||"").trim().toLowerCase();
  for(const m of list){if(!m||!m.id||seen.has(m.id))continue;seen.add(m.id);n++;
    const ext="ai_"+m.client,at=new Date(m.at).toISOString();
    let id=Object.keys(S.conversations).find(k=>S.conversations[k].external_user_id===ext);
    const top=(m.intents||[]).map(i=>`${i.label} ${Math.round(i.score*100)}%`).join(", ")||"nothing sure";
    const add=[{at,from:"client",text:m.text},...(m.reply?[{at,from:"ai",text:m.reply}]:[]),{at,from:"system",text:`Test (VoroniX AI site) · VoroniX AI understood: ${top} (${m.lang})${m.unsure?" · unsure":""}`}];
    if(!id){id=nextId("conversations","CV-",4);put("conversations",id,{messenger:MSGR[m.channel]||"Instagram",contact:m.name||"Test client",external_user_id:ext,client_id:null,stage:"In dialog",ai_enabled:false,needs_human:false,test:true,updated_at:at,messages:add})}
    else{const c=S.conversations[id];put("conversations",id,{...c,messages:[...(c.messages||[]),...add].slice(-200),updated_at:at})}
    const b=m.booking;if(!b)continue;
    const code=S.services[b.serviceId]?b.serviceId:Object.keys(S.services).find(k=>low(S.services[k].name)===low(b.service));
    const mid=S.masters[b.staffId]?b.staffId:Object.keys(S.masters).find(k=>low(S.masters[k].full_name)===low(b.staff));
    const ap="AI-"+String(b.id).replace(/[^\w-]/g,"").slice(-24);
    if(b.cancelled){if(S.appointments[ap])patch("appointments",ap,{status:"Cancelled"});continue}
    if(!code||!mid){pushMsg(id,{from:"system",text:`Test booking not added to the calendar: this CRM has no ${!code?"service «"+b.service+"»":"staff member «"+b.staff+"»"}.`});continue}
    const conv=S.conversations[id];let cid=conv.client_id;
    if(!cid){cid=nextId("clients","CL-",4);put("clients",cid,{display_name:m.name||"Test client",phone:"",created_at:dt(new Date(m.at)),notes:"Test client from the VoroniX AI site",test:true});patch("conversations",id,{client_id:cid})}
    put("appointments",ap,{client_id:cid,master_id:mid,service_code:code,start_datetime:String(b.start).replace("T"," ").slice(0,16),status:"Booked",source:"Test (VoroniX AI site)",test:true,created_at:dt(new Date(m.at))});
  }
  if(n)try{localStorage.setItem(AI_SEEN,JSON.stringify([...seen].slice(-3000)))}catch(_){}
  return n}
addEventListener("storage",e=>{if(e.key===AI_RECENT&&!demo)fromAiSite()});
function deleteTests(){let n=0;for(const c of ["conversations","appointments","clients"])for(const id of Object.keys(S[c]))if(S[c][id]&&S[c][id].test){del(c,id);n++}toast(n?`Deleted ${n} test records`:"No test chats")}
/* No server and no site database (GitHub Pages): every table is kept in this browser's
   localStorage under "vx-crm:<table>", so chats (Telegram too), clients and visits stay after
   a reload. The Demo button swaps in the demo barbershop for testing; it is never saved. */
const LOCAL="vx-crm:";let demo=false,saveT=0;const dirty=new Set();
function localLoad(){const o={};for(const c of COLS){try{o[c]=JSON.parse(localStorage.getItem(LOCAL+c)||"{}")||{}}catch(_){o[c]={}}}return o}
function localSave(col){if(live||demo)return;dirty.add(col);clearTimeout(saveT);saveT=setTimeout(localFlush,100)}
function localFlush(){clearTimeout(saveT);if(live||demo){dirty.clear();return}for(const c of dirty){try{localStorage.setItem(LOCAL+c,JSON.stringify(S[c]))}catch(e){toast("Could not save in this browser: "+(e.message||e))}}dirty.clear()}
addEventListener("pagehide",localFlush);
addEventListener("storage",e=>{if(live||demo||!e.key||!e.key.startsWith(LOCAL))return;const c=e.key.slice(LOCAL.length);if(!COLS.includes(c)||dirty.has(c))return;try{S[c]=JSON.parse(e.newValue||"{}")||{}}catch(_){S[c]={}}setBanner();scheduleRender()});
function put(col,id,data){
  S[col][id]=data;scheduleRender();
  if(!live){localSave(col);return Promise.resolve()}
  const key=col+"/"+id;inflight[key]=(inflight[key]||0)+1;
  pending[key]=(pending[key]||Promise.resolve()).then(()=>db.collection(col).doc(id).set(S[col][id]??data)).finally(()=>{inflight[key]--}).catch(e=>{if(e&&e.code==="invalid_argument"){canWrite=false;toast("You have view-only access, so changes are not saved.")}else toast("Could not save: "+(e&&e.message||e))});
  return pending[key];
}
function patch(col,id,p){return put(col,id,{...(S[col][id]||{}),...p})}
function del(col,id){delete S[col][id];scheduleRender();if(!live)localSave(col);if(live){const key=col+"/"+id;deleting[key]=1;return db.collection(col).doc(id).delete().catch(e=>toast("Could not delete: "+(e.message||e))).finally(()=>{delete deleting[key]})}}
const vals=col=>Object.entries(S[col]).map(([id,v])=>({id,...v}));
const biz=()=>S.settings.business||{};
function nextId(col,prefix,width,start){let max=start||0;for(const id of Object.keys(S[col])){const m=new RegExp("^"+prefix+"(\\d+)$").exec(id);if(m)max=Math.max(max,+m[1])}return prefix+String(max+1).padStart(width,"0")}

/* ---------- derived helpers ---------- */
const svc=code=>S.services[code];
const mst=id=>S.masters[id];
const cli=id=>S.clients[id];
const mastersFor=code=>vals("master_services").filter(x=>x.service_code===code).map(x=>x.master_id).filter(id=>mst(id)&&mst(id).is_active!==false);
const servicesOf=mid=>vals("master_services").filter(x=>x.master_id===mid).map(x=>x.service_code);
const active=a=>a.status!=="Cancelled";
function apptEnd(a){const st=parseDT(a.start_datetime);const d=(svc(a.service_code)||{}).duration_min||60;return new Date(st.getTime()+d*60000)}
function prepayFor(code){const b=biz(),s=svc(code);if(!s)return 0;return s.price_kzt>=(+b.prepay_min_price||Infinity)?Math.round(s.price_kzt*(+b.prepay_percent||0)/100):0}
function freeSlots(code,dateStr,masterId){
  const s=svc(code);if(!s)return {error:"Unknown service_code "+code};
  const day=parseDT(dateStr+" 00:00");if(!day)return {error:"date must be YYYY-MM-DD"};
  const now=new Date(),dur=s.duration_min||60,out=[];
  for(const mid of (masterId?[masterId]:mastersFor(code))){
    const m=mst(mid);if(!m||!mastersFor(code).includes(mid))continue;
    if(!(m.days||[1,2,3,4,5,6]).includes(day.getDay()))continue;
    const busy=vals("appointments").filter(a=>a.master_id===mid&&active(a)&&a.start_datetime.startsWith(dateStr)).map(a=>[toMin(a.start_datetime.slice(11)),toMin(hm(apptEnd(a)))]);
    const times=[];
    for(let t=toMin(m.work_start||"09:00");t+dur<=toMin(m.work_end||"20:00");t+=30){
      const slot=new Date(day.getTime()+t*60000);if(slot<=now)continue;
      if(busy.some(([b,e])=>t<e&&t+dur>b))continue;
      times.push(pad(Math.floor(t/60))+":"+pad(t%60));
    }
    if(times.length)out.push({master_id:mid,master:m.full_name,times});
  }
  return {service:s.name,duration_min:dur,date:dateStr,weekday:DOW[day.getDay()],slots:out};
}
function convClientAppts(conv){if(!conv.client_id)return [];return vals("appointments").filter(a=>a.client_id===conv.client_id).sort((a,b)=>a.start_datetime<b.start_datetime?-1:1)}
function revenueOf(list){return list.filter(a=>a.status==="Completed").reduce((s,a)=>s+((svc(a.service_code)||{}).price_kzt||0),0)}

/* ---------- demo data ---------- */
function demoData(){
  const D={};COLS.forEach(c=>D[c]={});
  D.settings.business={name:"Barberista",type:"Barbershop",city:"Almaty",address:"Panfilov St 98 (demo address)",hours:"Daily 10:00–21:00",phone:"+7 700 000 0000 (demo)",tone:"Friendly and to the point, like a good barber. Address clients formally. Use at most one emoji.",languages:"Russian, Kazakh, English",staff_label:"Barber",service_label:"Service",prepay_percent:30,prepay_min_price:20000,ai_tier:"quick",autopilot:true,catchphrase:"Barberista: стиль без компромиссов 💈"};
  const SV=[["HC-01","Men's haircut",60,7000,"Haircut"],["HC-02","Clipper cut",30,4000,"Haircut"],["KD-03","Kids haircut",45,5000,"Haircut"],["BD-04","Beard trim and shaping",45,5000,"Beard"],["CB-05","Haircut + beard",90,11000,"Combo"],["SH-06","Royal hot-towel shave",45,6000,"Shave"],["VP-07","VIP ritual",150,22000,"Combo"],["CM-08","Grey camouflage",30,5000,"Colour"]];
  SV.forEach(([c,n,d,p,cat])=>D.services[c]={name:n,duration_min:d,price_kzt:p,category:cat,is_active:true});
  const MS=[["MS-01","Timur B.","Senior barber","10:00","21:00",[1,2,3,4,5,6]],["MS-02","Arman K.","Barber","10:00","21:00",[1,2,3,4,5,6]],["MS-03","Daniyar S.","Barber","12:00","21:00",[0,2,3,4,5,6]],["MS-04","Yerzhan M.","Shave master","10:00","19:00",[1,2,3,4,5]]];
  MS.forEach(([id,n,sp,ws,we,days])=>D.masters[id]={full_name:n,specialization:sp,is_active:true,work_start:ws,work_end:we,days});
  [["MS-01","HC-01","Senior"],["MS-01","BD-04","Senior"],["MS-01","CB-05","Senior"],["MS-01","VP-07","Senior"],["MS-01","CM-08","Senior"],["MS-02","HC-01","Senior"],["MS-02","HC-02","Senior"],["MS-02","KD-03","Senior"],["MS-02","CB-05","Junior"],["MS-03","HC-01","Junior"],["MS-03","HC-02","Senior"],["MS-03","BD-04","Senior"],["MS-03","KD-03","Junior"],["MS-04","SH-06","Senior"],["MS-04","BD-04","Senior"],["MS-04","VP-07","Junior"]].forEach(([m,s,l])=>D.master_services[m+"__"+s]={master_id:m,service_code:s,skill_level:l,since_date:"2025-03-01"});
  const NAMES=["Arman T.","Bekzat T.","Saule M.","Aslan N.","Daniyar Zh.","Erlan S.","Kamal B.","Marat O.","Nurlan A.","Azamat T.","Galym E.","Zhandos U.","Daulet K.","Temirlan R.","Ainur S.","Miras D.","Yerlan B.","Alibek I.","Sanzhar L.","Ruslan P.","Aidos F.","Timur Zh.","Batyr V.","Asset G.","Bauyrzhan M.","Zhan Y.","Islam T.","Dias R.","Kairat S.","Madi N."];
  const MSG=["WhatsApp","Telegram","Instagram"];
  let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const today=new Date();today.setHours(0,0,0,0);
  let ch=0;
  NAMES.forEach((n,i)=>{const id="CL-"+String(i+1).padStart(4,"0");D.clients[id]={display_name:n,phone:i%5===3?"":"+7 70"+(i%9)+" 000 "+String(1000+i*37).slice(-4),created_at:dt(addDays(today,-60+i)),notes:i===2?"Brings her son Alikhan (7). Scissors only, he is afraid of the clipper.":"",prefs:i===0?[{text:"Стрижка и борода только у Тимура, фейд 0,5 по бокам",at:new Date(Date.now()-11400000).toISOString(),source:"Telegram"},{text:"Удобно по пятницам после 18:00",at:new Date(Date.now()-11100000).toISOString(),source:"Telegram"}]:i===2?[{text:"Сын Алихан, 7 лет: стричь ножницами, машинки боится",at:new Date(Date.now()-180000000).toISOString(),source:"WhatsApp"}]:[]};
    const m=MSG[i%3];D.client_channels["CH-"+String(++ch).padStart(4,"0")]={client_id:id,messenger:m,external_user_id:m.slice(0,2).toLowerCase()+"_"+(5000+i*13)};
    if(i%6===0){const m2=MSG[(i+1)%3];D.client_channels["CH-"+String(++ch).padStart(4,"0")]={client_id:id,messenger:m2,external_user_id:m2.slice(0,2).toLowerCase()+"_"+(7000+i*11)}}});
  const NS={"VP-07":.25,"CB-05":.1,"HC-01":.06,"HC-02":.05,"KD-03":.12,"BD-04":.05,"SH-06":.08,"CM-08":.05};
  let ap=1000,pay=0;const busy={};
  const book=(day,mid,code,status,src)=>{const m=D.masters[mid];if(!m.days.includes(day.getDay()))return null;const dur=D.services[code].duration_min;
    for(let k=0;k<8;k++){const t=toMin(m.work_start)+Math.floor(rnd()*((toMin(m.work_end)-dur-toMin(m.work_start))/30+1))*30;const key=mid+ymd(day);busy[key]=busy[key]||[];if(busy[key].some(([b,e])=>t<e&&t+dur>b))continue;busy[key].push([t,t+dur]);
      const id="AP-"+(++ap);const cid="CL-"+String(2+Math.floor(rnd()*29)).padStart(4,"0");const start=ymd(day)+" "+pad(Math.floor(t/60))+":"+pad(t%60);
      D.appointments[id]={client_id:cid,master_id:mid,service_code:code,start_datetime:start,status,source:src,created_at:dt(addDays(day,-3))};return id}return null};
  const pairs=Object.values(D.master_services);
  {const fri=addDays(today,((5-today.getDay()+7)%7)||7);busy["MS-01"+ymd(fri)]=[[18*60,18*60+150]];const id="AP-"+(++ap);
    D.appointments[id]={client_id:"CL-0001",master_id:"MS-01",service_code:"VP-07",start_datetime:ymd(fri)+" 18:00",status:"Confirmed",source:"Telegram",created_at:dt(new Date())};
    D.payments["PM-"+String(++pay).padStart(5,"0")]={appointment_id:id,amount_kzt:6600,kind:"prepayment",method:"Kaspi QR",status:"Paid",created_at:dt(new Date()),paid_at:dt(new Date())}}
  for(let d=-45;d<=10;d++){const day=addDays(today,d);const n=d<0?6:(d===0?6:3);
    for(let j=0;j<n;j++){const pr=pairs[Math.floor(rnd()*pairs.length)];let st;
      if(d<0){const x=rnd();st=x<NS[pr.service_code]?"No-show":(x>.96?"Cancelled":"Completed");if(d>=-2&&j===0)st="Booked"}
      else st=rnd()<.5?"Confirmed":"Booked";
      const src=["WhatsApp","Telegram","Instagram","Admin"][Math.floor(rnd()*4)];
      const id=book(day,pr.master_id,pr.service_code,st,src);
      if(id&&st==="Completed"){const a=D.appointments[id];D.payments["PM-"+String(++pay).padStart(5,"0")]={appointment_id:id,amount_kzt:D.services[a.service_code].price_kzt,kind:"full",method:["Kaspi QR","Card","Cash"][Math.floor(rnd()*3)],status:"Paid",created_at:a.start_datetime,paid_at:a.start_datetime}}
      if(id&&d>=0&&st==="Confirmed"&&D.services[pr.service_code].price_kzt>=20000){const a=D.appointments[id];D.payments["PM-"+String(++pay).padStart(5,"0")]={appointment_id:id,amount_kzt:Math.round(D.services[a.service_code].price_kzt*.3),kind:"prepayment",method:"Kaspi QR",status:"Paid",created_at:a.created_at,paid_at:a.created_at}}
    }}
  const t0=addDays(new Date(),0);const ago=min=>new Date(t0.getTime()-min*60000).toISOString();
  D.conversations["CV-0001"]={messenger:"Telegram",contact:"Arman T.",external_user_id:"te_5000",client_id:"CL-0001",appointment_id:"AP-1001",stage:"Paid",ai_enabled:true,needs_human:false,updated_at:ago(180),messages:[
    {from:"client",text:"Салем! хочу на вип-комплекс в эту пятницу, сколько стоит?",at:ago(200)},
    {from:"ai",text:"Здравствуйте, Арман! VIP-ритуал: стрижка, борода, королевское бритьё и уход за лицом. Стоит 22 000 ₸, длится около 2,5 часов. На какое время в пятницу удобно?",at:ago(199)},
    {from:"client",text:"после 6 вечера можно?",at:ago(195)},
    {from:"ai",text:"В пятницу к Тимуру свободно 18:00 и 18:30. Какое время выбрать?",at:ago(194)},
    {from:"client",text:"18:00",at:ago(190)},
    {from:"system",text:"AI booked VIP ritual with Timur B. and sent a prepayment link (30%).",at:ago(189)},
    {from:"ai",text:"Записали вас на пятницу в 18:00 к Тимуру. Для VIP-ритуала нужна предоплата 30%: 6 600 ₸, ссылка ниже.",at:ago(189)},

}

/* ---------- Telegram bot, run by this page while it is open ----------
   The page asks Telegram for new messages (getUpdates, long polling), VoroniX AI answers,
   and the answer goes back with sendMessage. No server is needed, but the bot answers only
   while this page is open somewhere. The token is kept only in this browser. */
const TG_KEY="vx-tg-token";const tg={token:"",offset:0,on:false,bot:"",err:"",ctl:null,run:0};
async function tgApi(method,body){
  const r=await fetch(`https://api.telegram.org/bot${tg.token}/${method}`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body||{}),signal:tg.ctl&&tg.ctl.signal});
  const j=await r.json().catch(()=>({ok:false,description:"Telegram answered "+r.status}));
  if(!j.ok)throw new Error(j.description||"Telegram error");return j.result}
function tgSave(status,detail){saveInt("telegram",{...(intState().telegram||{}),status,detail,hint:tg.token?"••••"+tg.token.slice(-4):"",at:new Date().toISOString(),settings:{}});scheduleRender()}
async function tgStart(token){
  tgStop();tg.token=token;tg.ctl=new AbortController();tg.err="";const run=++tg.run;
  try{
    const me=await tgApi("getMe");tg.bot=me.username;
    // A webhook set earlier (for example by the VoroniX server) blocks getUpdates.
    const hook=await tgApi("getWebhookInfo");if(hook.url)await tgApi("deleteWebhook",{drop_pending_updates:false});
    tg.on=true;try{localStorage.setItem(TG_KEY,token)}catch(_){}
    toast(`Telegram: @${me.username} is on`);
    // Only one open tab may read the bot: two readers make Telegram answer "Conflict" and slow every reply.
    // The other tabs wait and take over when that tab closes.
    if(navigator.locks&&navigator.locks.request){
      const held=await navigator.locks.query().then(q=>q.held.some(l=>l.name==="vx-telegram")).catch(()=>false);
      if(held)tgSave("connected",`@${me.username} is answered by another open tab of this page. This tab takes over when that one closes.`);
      navigator.locks.request("vx-telegram",async()=>{if(run!==tg.run||!tg.on)return;tgSave("connected",`@${me.username} is answering with VoroniX AI. It works while this page is open, in any tab or window; close it and the bot stops.`);await tgLoop(run)});
    }else{tgSave("connected",`@${me.username} is answering with VoroniX AI. It works while this page is open, in any tab or window; close it and the bot stops.`);tgLoop(run)}
  }catch(e){tg.on=false;tg.err=e.message||String(e);
    tgSave("error",/Unauthorized|Not Found/i.test(tg.err)?"Telegram does not accept this token. Copy it again from @BotFather.":/fetch|network|load/i.test(tg.err)?"This browser could not reach api.telegram.org: "+tg.err:"Telegram: "+tg.err)}
}
/* The waiting for new messages runs in a background thread of the page (a Web Worker): browsers slow
   a hidden tab's own code down, a worker much less. Answers are still made here, as before. */
const TG_WORKER=`let on=false,ctl=null;
onmessage=async e=>{const d=e.data;
  if(d.cmd==="stop"){on=false;if(ctl)ctl.abort();return}
  if(d.cmd!=="start")return;on=true;let offset=d.offset||0;
  while(on){ctl=new AbortController();
    try{const r=await fetch("https://api.telegram.org/bot"+d.token+"/getUpdates",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({offset,timeout:25,allowed_updates:["message"]}),signal:ctl.signal});
      const j=await r.json().catch(()=>({ok:false,description:"Telegram answered "+r.status}));if(!j.ok)throw new Error(j.description||"Telegram error");
      if(j.result.length)offset=j.result[j.result.length-1].update_id+1;postMessage({type:"updates",updates:j.result,offset})}
    catch(err){if(!on)return;postMessage({type:"error",error:String(err&&err.message||err)});await new Promise(r=>setTimeout(r,4000))}}};`;
function tgStop(){tg.on=false;tg.run++;if(tg.ctl)tg.ctl.abort();tg.ctl=null;if(tg.worker){tg.worker.postMessage({cmd:"stop"});tg.worker.terminate();tg.worker=null}if(tg.done){tg.done();tg.done=null}}
function tgOk(){if(tg.err){tg.err="";tgSave("connected",`@${tg.bot} is answering with VoroniX AI. It works while this page is open, in any tab or window; close it and the bot stops.`)}}
function tgFail(msg,run){if(!tg.on||run!==tg.run)return;tg.err=msg;
  if(/Conflict/i.test(msg))tgSave("error","Another program is reading this bot's messages (another open tab or the VoroniX server). Keep one.");
  else tgSave("error","Telegram connection lost, trying again: "+msg)}
async function tgLoop(run){
  let w=null;try{w=typeof Worker!=="undefined"?new Worker(URL.createObjectURL(new Blob([TG_WORKER],{type:"text/javascript"}))):null}catch(_){w=null}
  if(w){tg.worker=w;let queue=Promise.resolve();
    w.onmessage=e=>{const d=e.data;if(run!==tg.run)return;
      if(d.type==="error")return tgFail(d.error,run);
      tg.offset=d.offset;tgOk();
      for(const u of d.updates)queue=queue.then(()=>tgIncoming(u.message)).catch(err=>toast("Telegram message failed: "+err.message))};
    w.onerror=()=>{w.terminate();if(tg.worker===w)tg.worker=null;if(tg.done){const d=tg.done;tg.done=null;d()}if(tg.on&&run===tg.run)tgLoopMain(run)};

async function tgLoopMain(run){
  while(tg.on&&run===tg.run){

      for(const u of ups){tg.offset=u.update_id+1;await tgIncoming(u.message).catch(e=>toast("Telegram message failed: "+e.message))}

async function tgIncoming(m){

PAGES.calendar={head:()=>head("Calendar","",`<button class="btn create" data-act="newAppt">+ New booking</button><div class="tabs"><button data-cal="-1">←</button><button data-cal="0" class="${calDay===ymd(new Date())?"on":""}">Today</button><button data-cal="1">→</button></div><input type="date" class="inp" id="calPick" data-fresh="1" value="${calDay}" style="width:auto">`),
 body(){
  const M=vals("masters").filter(m=>m.is_active!==false);const day=parseDT(calDay+" 00:00");
  const start=9*60,end=20*60,rows=(end-start)/30,RH=28,HH=48;
  const A=vals("appointments").filter(a=>a.start_datetime.startsWith(calDay));
  let html=`<div class="cal" style="grid-template-columns:56px repeat(${M.length},minmax(150px,1fr))"><div class="hh"></div>${M.map(m=>`<div class="hh">${esc(m.full_name)}<div class="muted small">${esc(m.specialization)} · ${(m.days||[]).includes(day.getDay())?m.work_start+"–"+m.work_end:"day off"}</div></div>`).join("")}`;
  for(let r=0;r<rows;r++){const t=start+r*30;html+=`<div class="tm">${r%2===0?pad(t/60|0)+":00":""}</div>`+M.map(m=>`<div class="cell ${r%2?"half":""}" data-newat="${m.id}|${calDay} ${pad(t/60|0)}:${pad(t%60)}"></div>`).join("")}
  html+=`</div>`;
  const evs=A.map(a=>{const ci=M.findIndex(m=>m.id===a.master_id);if(ci<0)return "";const st=toMin(a.start_datetime.slice(11));const dur=svc(a.service_code)?.duration_min||60;const top=HH+(st-start)/30*RH;const h=Math.max(RH-2,dur/30*RH-3);
    return `<div class="ev ${a.status}" data-appt="${a.id}" style="top:${top}px;height:${h}px;left:calc(56px + (100% - 56px) * ${ci}/${M.length} + 3px);width:calc((100% - 56px)/${M.length} - 6px)"><b>${a.start_datetime.slice(11)}</b> ${esc(cli(a.client_id)?.display_name||a.client_id)}<br><span class="muted">${esc(svc(a.service_code)?.name||"")}</span></div>`}).join("");
  const now=new Date();let nl="";if(calDay===ymd(now)){const mm=now.getHours()*60+now.getMinutes();if(mm>=start&&mm<=end)nl=`<div class="nowline" style="top:${HH+(mm-start)/30*RH}px"></div>`}
  return `<div class="panel tw"><div style="position:relative;min-width:${56+M.length*150}px">${html}${evs}${nl}</div></div><p class="muted small" style="color:var(--chrome-dim)">${DOW[day.getDay()]} ${calDay} · ${A.filter(active).length} bookings. Click an empty cell to book, click a booking to change its status.</p>`},
 after(){const p=$("#calPick");if(p)p.addEventListener("change",()=>{if(p.value){calDay=p.value;render()}})}};

  const K=vals("knowledge");const cats=[...new Set(K.map(k=>k.category||"General"))].sort();
  for(const c of cats)add(`knowledge/${c.toLowerCase().replace(/[^\p{L}\d]+/gu,"-")}.md`,c,`# ${c}\n\n${K.filter(k=>(k.category||"General")===c).map(k=>`## ${k.title}\n${k.content}`).join("\n\n")}`);
  for(const c of vals("clients").filter(c=>(c.prefs||[]).length||c.notes).sort((a,b)=>a.display_name.localeCompare(b.display_name))){
    const A=vals("appointments").filter(a=>a.client_id===c.id&&a.status==="Completed");const fav={};A.forEach(a=>fav[a.master_id]=(fav[a.master_id]||0)+1);const top=Object.entries(fav).sort((x,y)=>y[1]-x[1])[0];
    add(`clients/${c.display_name.replace(/[^\p{L}\d]+/gu,"-").replace(/^-|-$/g,"").toLowerCase()}.md`,c.display_name,`# ${c.display_name} (${c.id})\n\n- Phone: ${c.phone||""}\n- Visits: ${A.length}${top?`, most often with ${mst(top[0])?.full_name}`:""}\n\n## Preferences the AI remembers\n${(c.prefs||[]).map(p=>`- ${p.text} _(${p.source||""}, ${fmtAt(p.at)})_`).join("\n")||"- none yet"}\n\n## Notes\n${c.notes||""}`);
  }

/* Notes from the owner -> knowledge entries and settings, by VoroniX AI's own rules (no outside service). */
function sortNotes(txt){
  const settings={},entries=[];
  const cat=t=>/скидк|акци|%|бесплат|подар|discount|promo|free|жеңілдік/i.test(t)?"Promotions":/цен|стоит|₸|тенге|kzt|price|cost|баға/i.test(t)?"Prices":/опозд|отмен|перенос|правил|предоплат|late|cancel|rule|prepay|ереже/i.test(t)?"Rules":/телефон|адрес|instagram|whatsapp|телеграм|phone|address|мекенжай/i.test(t)?"Contacts":"FAQ";
  const blocks=txt.replace(/\r/g,"").split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const isHead=l=>l.length<=60&&!/[:.!?]$/.test(l)&&!/[:]/.test(l)&&!/\d{1,2}[:.]\d\d/.test(l);
  const sectioned=blocks.filter(b=>b.includes("\n")&&isHead(b.split("\n")[0])).length>=2;
  if(sectioned){
    blocks.forEach((b,i)=>{const L=b.split("\n").map(x=>x.trim()).filter(Boolean);
      if(i===0&&L.length===1&&isHead(L[0])){settings.name=L[0].replace(/[«»"“”]/g,"").trim();return}
      const title=isHead(L[0])&&L.length>1?L.shift():L[0].replace(/[^\p{L}\p{N}%₸ ]/gu," ").split(/\s+/).filter(Boolean).slice(0,6).join(" ");
      const content=L.join("\n");const c1=cat(title);entries.push({title:title.slice(0,60),category:c1!=="FAQ"?c1:cat(content),content});
      if(/^(тон|tone|стиль общения)/i.test(title))settings.tone=content.replace(/\n/g," ").replace(/Языки?:.*$/i,"").trim();
      if(/^(часы работы|график работы|режим работы|opening hours|hours|жұмыс уақыты)/i.test(title))settings.hours=L.join("; ");
    });
  }else{
    const parts=txt.split(/\n\s*\n|(?<=[.!?])\s+(?=[A-ZА-ЯЁӘҒҚҢӨҰҮҺІ«"])/).map(x=>x.trim()).filter(x=>x.length>3);
    for(const t of parts){
      const hours=/(работаем|часы работы|open|hours|жұмыс уақыты)[^\d]*(\d{1,2}[:.]\d\d)\s*[–—-]\s*(\d{1,2}[:.]\d\d)/i.exec(t);if(hours){settings.hours=`Daily ${hours[2].replace(".",":")}–${hours[3].replace(".",":")}`;continue}
      const words=t.replace(/[^\p{L}\p{N}%₸ ]/gu," ").split(/\s+/).filter(Boolean);
      entries.push({title:words.slice(0,6).join(" ").slice(0,60),category:cat(t),content:t});
    }
  }
  const slogan=/(слоган|slogan|девиз|ұран)[^«"“\n]*[«"“]([^»"”]+)[»"”]/i.exec(txt);if(slogan)settings.catchphrase=slogan[2].trim();
  const line=re=>{const m=re.exec(txt);return m?m[1].trim().replace(/[.;]$/,""):""};
  const addr=line(/^\s*(?:адрес|address|мекенжай)\s*:\s*(.+)$/im);if(addr)settings.address=addr;
  const phone=line(/^\s*(?:телефон[^:\n]*|phone[^:\n]*|тел\.?)\s*:\s*(.+)$/im);if(phone)settings.phone=phone;
  const langs=line(/^\s*(?:языки|languages|тілдер)\s*:\s*(.+)$/im)||line(/(?:^|\s)(?:языки|languages)\s*:\s*([^\n]+)/i);if(langs)settings.languages=langs;
  const pp=/предоплат\S*\s+(\d{1,2})\s*%|prepay\S*\s+(\d{1,2})\s*%/i.exec(txt),ppmin=/(?:от|from|over)\s*([\d\s]{3,9})\s*(?:₸|тг|тенге|kzt)[^\n]{0,40}предоплат|предоплат[^\n]{0,40}(?:от|from)\s*([\d\s]{3,9})\s*(?:₸|тг)/i.exec(txt);
  if(pp)settings.prepay_percent=String(+(pp[1]||pp[2]));if(ppmin)settings.prepay_min_price=String(+(ppmin[1]||ppmin[2]).replace(/\s/g,""));
  const {services,staff}=parseRoster(txt);
  return {entries,settings,services,staff};
}
/* Price lists and staff schedules written as plain lines:
   "Маникюр классический: 5 000 ₸, 60 минут"
   "Айгерим Сейткали, мастер маникюра: вторник, среда, 10:00 до 19:00. Делает маникюр, педикюр." */
const WD=[[0,/^(воскресень|вс$|sun|жексенб)/],[1,/^(понедельн|пн$|mon|дүйсенб)/],[2,/^(вторн|вт$|tue|сейсенб)/],[3,/^(сред|ср$|wed|сәрсенб)/],[4,/^(четверг|чт$|thu|бейсенб)/],[5,/^(пятниц|пт$|fri|жұма)/],[6,/^(суббот|сб$|sat|сенб)/]];
const wdOf=w=>{w=w.toLowerCase();for(const [d,re] of WD)if(re.test(w))return d;return -1};
function daysIn(t){
  if(/ежедневно|каждый день|без выходных|daily|every day|күн сайын/i.test(t))return [0,1,2,3,4,5,6];
  const out=new Set(),toks=t.toLowerCase().match(/[\p{L}]+|[–—-]/gu)||[];
  for(let i=0;i<toks.length;i++){const d=wdOf(toks[i]);if(d<0)continue;
    if(toks[i+1]&&/^[–—-]$/.test(toks[i+1])&&toks[i+2]&&wdOf(toks[i+2])>=0){let e=wdOf(toks[i+2]);for(let k=d;;k=(k+1)%7){out.add(k);if(k===e)break}i+=2}else out.add(d)}
  return [...out].sort()}
const STOP=new Set(["и","с","в","на","до","от","для","по","and","with","the","of"]);
const stems=t=>(t.toLowerCase().match(/[\p{L}]+/gu)||[]).filter(w=>!STOP.has(w)&&w.length>1).map(w=>w.slice(0,4));
function parseRoster(txt){
  const services=[],staff=[],L=txt.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean);
  const range=/(\d{1,2})[:.](\d\d)\s*(?:до|–|—|-|to)\s*(\d{1,2})[:.](\d\d)/i;
  for(const l of L){
    const sv=/^(.{2,80}?)\s*[:–—]\s*(от\s+|from\s+)?(\d[\d\s]{0,8}\d|\d)\s*(₸|тг|тенге|kzt|\$|usd|руб)?\s*[,;]?\s*(?:(\d{1,3})\s*(мин|min|минут)\w*|(\d(?:[.,]\d)?)\s*(ч|час|hours?|h)\b)?/i.exec(l);
    if(sv&&(sv[4]||sv[5]||sv[7])&&!range.test(l)){const price=+sv[3].replace(/\s/g,"");if(price>=100){services.push({name:sv[1].replace(/^[-•*\d.)\s]+/,"").trim(),price,minutes:sv[5]?+sv[5]:sv[7]?Math.round(parseFloat(sv[7].replace(",","."))*60):60,from:!!sv[2]});continue}}
    const st=/^([\p{Lu}][\p{L}'-]+(?:\s+[\p{Lu}][\p{L}'.-]*)?)\s*,\s*([^:]{2,60}):\s*(.+)$/u.exec(l);
    if(st){const rest=st[3],days=daysIn(rest),r=range.exec(rest);if(days.length&&r){
      const does=(/(?:делает|выполняет|услуги|does|services)\s*:?\s*(.+)$/i.exec(rest)||[])[1]||"";
      staff.push({name:st[1].trim(),role:st[2].trim(),days,from:r[1].padStart(2,"0")+":"+r[2],to:r[3].padStart(2,"0")+":"+r[4],does});continue}}
    const dz=/^(?:делает|выполняет|does)\s*:?\s*(.+)$/i.exec(l);if(dz&&staff.length&&!staff[staff.length-1].does)staff[staff.length-1].does=dz[1];
  }
  // Which services each person does: every listed item ("маникюр", "наращивание ногтей") must fit
  // inside the service name and share its first or last word.
  for(const p of staff){const items=p.does.split(/,|;|\s+и\s+|\s+and\s+/i).map(stems).filter(x=>x.length);
    p.services=services.filter(s=>{const S=stems(s.name);return items.some(it=>it.every(w=>S.includes(w))&&(it.includes(S[0])||it[it.length-1]===S[S.length-1]))}).map(s=>s.name)}
  return {services,staff};
}

let SQLlib=null;
function loadSQL(){return SQLlib?Promise.resolve(SQLlib):new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/sql-asm.js";s.onload=()=>window.initSqlJs().then(L=>{SQLlib=L;res(L)},rej);s.onerror=()=>rej(new Error("Could not load the SQL engine"));document.head.appendChild(s)})}
async function runSQL(){
  sqlText=$("#sqlBox").value;const out=$("#sqlOut");out.innerHTML='<span class="muted">Loading SQL engine…</span>';
  try{const L=await loadSQL();const d=new L.Database();
    for(const [n,pk,fks,fields] of SCHEMA){const pkCol=pk.startsWith("(")?null:pk;const uniq=[...(pkCol?[pkCol]:[]),...fks.map(f=>f[0]),...fields];
      d.run(`CREATE TABLE ${n} (${uniq.map(c=>c+(c===pkCol?" TEXT PRIMARY KEY":"")).join(", ")})`);
      const st=d.prepare(`INSERT INTO ${n} VALUES (${uniq.map(()=>"?").join(",")})`);
      for(const r of vals(n)){st.run(uniq.map(c=>{const v=c===pkCol?r.id:r[c];return v==null?null:(typeof v==="object"?JSON.stringify(v):(typeof v==="boolean"?(v?1:0):v))}))}st.free()}
    const res=d.exec(sqlText);d.close();
    if(!res.length){sqlOut='<span class="muted">Query ran. No rows returned.</span>'}
    else{const r=res[res.length-1];sqlOut=`<table class="t"><thead><tr>${r.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${r.values.slice(0,200).map(v=>`<tr>${v.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table><div class="muted small" style="padding:6px 0">${r.values.length} rows</div>`}
  }catch(err){sqlOut=`<div class="banner" style="background:var(--red-soft)">${esc(err.message||err)}</div>`}
  out.innerHTML=sqlOut;
}

function modal(title,body,foot,wide){$("#modal").innerHTML=`<div class="scrim" data-scrim><div class="modal ${wide?"wide":""}" role="dialog" aria-label="${esc(title)}"><div class="ph"><h3>${esc(title)}</h3><span class="grow"></span><button class="x" data-close aria-label="Close">×</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:""}</div></div>`;const f=$("#modal input:not([type=hidden]),#modal select,#modal textarea");f&&f.focus()}
function closeModal(){$("#modal").innerHTML=""}
document.addEventListener("click",e=>{if(e.target.matches("[data-scrim]")||e.target.closest("[data-close]"))closeModal()});

const opt=(list,sel)=>list.map(([v,l])=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(l)}</option>`).join("");

   <div class="frow"><div class="f"><label for="ap_c">Client</label><select id="ap_c">${opt(vals("clients").sort((x,y)=>x.display_name.localeCompare(y.display_name)).map(c=>[c.id,c.display_name+" · "+c.id]),a.client_id)}</select></div>
   <div class="f"><label for="ap_s">Service</label><select id="ap_s">${opt(vals("services").filter(s=>s.is_active!==false).map(s=>[s.id,s.name+" · "+money(s.price_kzt)]),a.service_code)}</select></div></div>
   <div class="frow"><div class="f"><label for="ap_m">${esc(biz().staff_label||"Master")}</label><select id="ap_m">${opt(vals("masters").map(m=>[m.id,m.full_name]),a.master_id)}</select></div>

   <div id="ap_err"></div>
   ${id?`<div><b>Payments</b> ${P.length?P.map(p=>`<div class="small">${p.id} · ${money(p.amount_kzt)} · ${esc(p.kind)} ${pill(p.status)}</div>`).join(""):'<span class="muted small">none</span>'}</div><div class="muted small">Source: ${esc(a.source||"")} · created ${esc(a.created_at||"")}</div>`:""}`,
   `${id?`<button class="btn" data-takepay="${id}">Take full payment</button>`:""}<span style="flex:1"></span><button class="btn" data-close>Close</button><button class="btn create" data-saveappt="${id||""}">${id?"Save":"Book"}</button>`);

function saveAppt(id){
  const v=x=>document.getElementById(x).value;const code=v("ap_s"),mid=v("ap_m"),st=v("ap_d").replace("T"," ").slice(0,16),status=v("ap_st"),err=$("#ap_err");
  if(!v("ap_c")||!code||!mid||!st){err.innerHTML='<div class="banner">Fill in client, service, master and time.</div>';return}
  if(!mastersFor(code).includes(mid)){err.innerHTML=`<div class="banner">${esc(mst(mid).full_name)} does not do ${esc(svc(code).name)}. Pick: ${mastersFor(code).map(m=>esc(mst(m).full_name)).join(", ")}.</div>`;return}
  const s=parseDT(st),dur=svc(code).duration_min;const clash=vals("appointments").find(a=>a.id!==id&&a.master_id===mid&&active(a)&&status!=="Cancelled"&&(()=>{const b=parseDT(a.start_datetime);return s<apptEnd(a)&&new Date(s.getTime()+dur*60000)>b})());
  if(clash){err.innerHTML=`<div class="banner">This time overlaps booking ${clash.id} (${clash.start_datetime}). One master cannot have two visits at once.</div>`;return}
  const base=id?S.appointments[id]:{source:"Admin",created_at:dt(new Date())};
  const nid=id||nextId("appointments","AP-",4,1000);put("appointments",nid,{...base,client_id:v("ap_c"),service_code:code,master_id:mid,start_datetime:st,status});
  if(status==="Completed")vals("conversations").filter(c=>c.client_id===v("ap_c")&&(c.stage==="Paid"||c.stage==="Booked")).forEach(c=>patch("conversations",c.id,{stage:"Visited"}));
  closeModal();toast(id?"Booking saved":"Booked "+nid);
}

document.addEventListener("click",async e=>{
  const T=e.target.closest("[data-act],[data-appt],[data-client],[data-service],[data-master],[data-kb],[data-saveappt],[data-saveclient],[data-saveservice],[data-savemaster],[data-savekb],[data-delkb],[data-newat],[data-setst],[data-conv],[data-openconv],[data-as],[data-aireply],[data-stopai],[data-pay],[data-resolve],[data-delconv],[data-createconv],[data-markpaid],[data-refund],[data-takepay],[data-bookfor],[data-backconv],[data-confirmreset]");
  if(!T)return;const d=T.dataset;
  if(d.act==="newAppt")return apptModal(null,{start_datetime:dt(new Date(Math.ceil(Date.now()/1800000)*1800000))});
  if(d.act==="newClient")return clientModal(null);
  if(d.act==="newService")return serviceModal(null);
  if(d.act==="newMaster")return masterModal(null);
  if(d.act==="newKb")return kbModal(null);
  if(d.act==="newConv")return newConvModal();
  if(d.act==="resetDemo")return modal("Reset demo data?",`<p style="margin:0">This replaces every table with the demo barbershop data. Chats, clients and bookings you added will be lost.</p>`,`<span style="flex:1"></span><button class="btn" data-close>Cancel</button><button class="btn danger" data-confirmreset>Reset</button>`);
  if("confirmreset" in d){closeModal();await seedAll(true);return}
  if(d.act==="delTests"){deleteTests();return}
  if(d.act==="wipeLocal")return modal("Delete all your data?",`<p style="margin:0">This deletes every chat, client, visit, service and setting saved in this browser. It cannot be undone.</p>`,`<span style="flex:1"></span><button class="btn" data-close>Cancel</button><button class="btn danger" data-act="wipeLocalYes">Delete</button>`);
  if(d.act==="wipeLocalYes"){closeModal();for(const c of COLS){try{localStorage.removeItem(LOCAL+c)}catch(_){}S[c]={}}demo=false;modeChip();setBanner();render();toast("All data deleted");return}
  if("saveappt" in d)return saveAppt(d.saveappt||null);
  if("appt" in d)return apptModal(d.appt);
  if("bookfor" in d)return apptModal(null,{client_id:d.bookfor,start_datetime:dt(new Date(Math.ceil(Date.now()/1800000)*1800000))});
  if("newat" in d){const [m,t]=d.newat.split("|");const code=servicesOf(m)[0];return apptModal(null,{master_id:m,start_datetime:t,service_code:code})}
  if("client" in d)return clientModal(d.client);
  if("service" in d)return serviceModal(d.service);
  if("master" in d)return masterModal(d.master);
  if("kb" in d)return kbModal(d.kb);
  if("saveclient" in d){const v=x=>document.getElementById(x).value.trim();if(!v("cl_n"))return toast("Name is required");const id=d.saveclient||nextId("clients","CL-",4);put("clients",id,{...(S.clients[id]||{created_at:dt(new Date())}),display_name:v("cl_n"),phone:v("cl_p"),notes:v("cl_no")});closeModal();return toast("Client saved")}
  if("saveservice" in d){const v=x=>document.getElementById(x)?.value.trim();let id=d.saveservice;const err=$("#sv_err");
    if(!id){id=(v("sv_id")||"").toUpperCase();if(!/^[A-Z]{2}-\d{2}$/.test(id))return err.innerHTML='<div class="banner">Code must look like NS-07.</div>';if(S.services[id])return err.innerHTML='<div class="banner">This code is already used. Primary keys must be unique.</div>'}
    const dur=+v("sv_d"),pr=+v("sv_p");if(!v("sv_n"))return err.innerHTML='<div class="banner">Name is required.</div>';if(!(dur>=15&&dur<=240))return err.innerHTML='<div class="banner">Duration must be 15–240 minutes.</div>';if(!(pr>0))return err.innerHTML='<div class="banner">Price must be more than 0.</div>';
    put("services",id,{name:v("sv_n"),category:v("sv_c"),duration_min:dur,price_kzt:pr,is_active:document.getElementById("sv_a").checked});closeModal();return toast("Service saved")}
  if("savemaster" in d){const v=x=>document.getElementById(x).value.trim();if(!v("ms_n"))return toast("Name is required");const id=d.savemaster||nextId("masters","MS-",2);
    put("masters",id,{full_name:v("ms_n"),specialization:v("ms_s"),work_start:v("ms_ws"),work_end:v("ms_we"),days:[...document.querySelectorAll(".ms_day:checked")].map(x=>+x.value),is_active:document.getElementById("ms_a").checked});
    const want=new Set([...document.querySelectorAll(".ms_svc:checked")].map(x=>x.value));for(const code of servicesOf(id))if(!want.has(code))del("master_services",id+"__"+code);
    for(const code of want)if(!S.master_services[id+"__"+code])put("master_services",id+"__"+code,{master_id:id,service_code:code,skill_level:"Senior",since_date:ymd(new Date())});closeModal();return toast("Saved")}
  if("savekb" in d){const v=x=>document.getElementById(x).value.trim();if(!v("kb_t")||!v("kb_x"))return toast("Title and content are required");put("knowledge",d.savekb||nextId("knowledge","KB-",1),{title:v("kb_t"),category:v("kb_c")||"General",content:v("kb_x"),updated_at:nowISO()});closeModal();return toast("The AI now knows this")}
  if("delkb" in d){del("knowledge",d.delkb);closeModal();return toast("Entry deleted")}
  if("setst" in d){const [id,st]=d.setst.split("|");patch("appointments",id,{status:st});return toast(id+" marked "+st)}
  if("conv" in d||"openconv" in d){curConv=d.conv||d.openconv;if(route!=="inbox")go("inbox");else render();return}
  if("backconv" in d){curConv=null;return render()}
  if("as" in d){composeAs=d.as;return render()}
  if("aireply" in d)return aiReply(d.aireply);
  if("stopai" in d){aiCtl[d.stopai]?.abort();return}
  if("pay" in d){const [pid,cid]=d.pay.split("|");const p=S.payments[pid];if(!p||p.status==="Paid")return;
    await patch("payments",pid,{status:"Paid",paid_at:dt(new Date()),method:"Kaspi QR"});const a=S.appointments[p.appointment_id];if(a&&a.status==="Booked")patch("appointments",p.appointment_id,{status:"Confirmed"});
    patch("conversations",cid,{stage:"Paid"});await pushMsg(cid,{from:"system",text:`Payment received: ${money(p.amount_kzt)} (Kaspi QR). Booking confirmed.`});if(S.conversations[cid]?.ai_enabled)aiReply(cid);return}
  if("resolve" in d){patch("conversations",d.resolve,{needs_human:false,ai_enabled:true});return pushMsg(d.resolve,{from:"system",text:"Administrator handled the issue. AI autopilot is back on."})}
  if("delconv" in d){del("conversations",d.delconv);curConv=null;return}
  if("createconv" in d){const v=x=>document.getElementById(x).value.trim();const m=v("nc_m"),n=v("nc_n")||"guest_"+Math.floor(Math.random()*9000+1000),t=v("nc_t");
    const id=nextId("conversations","CV-",4);await put("conversations",id,{messenger:m,contact:n,external_user_id:m.slice(0,2).toLowerCase()+"_"+Math.floor(Math.random()*90000+10000),client_id:null,stage:"New",ai_enabled:biz().autopilot!==false,needs_human:false,updated_at:nowISO(),messages:[]});
    closeModal();curConv=id;composeAs="client";go("inbox");if(t){await pushMsg(id,{from:"client",text:t});if(S.conversations[id].ai_enabled)aiReply(id)}return}
  if("markpaid" in d){patch("payments",d.markpaid,{status:"Paid",paid_at:dt(new Date())});return toast("Marked as paid")}
  if("refund" in d){patch("payments",d.refund,{status:"Refunded"});return toast("Refund recorded")}
  if("takepay" in d){const a=S.appointments[d.takepay];put("payments",nextId("payments","PM-",5),{appointment_id:d.takepay,amount_kzt:svc(a.service_code).price_kzt,kind:"full",method:"Card",status:"Paid",created_at:dt(new Date()),paid_at:dt(new Date())});closeModal();return toast("Payment recorded")}
});
document.addEventListener("change",e=>{
  const t=e.target.closest("[data-aitoggle]");if(t){patch("conversations",t.dataset.aitoggle,{ai_enabled:t.checked,needs_human:t.checked?false:S.conversations[t.dataset.aitoggle].needs_human});return}
  const s=e.target.closest("[data-stage]");if(s)patch("conversations",s.dataset.stage,{stage:s.value});
});

/* ---------- boot ---------- */
let seeding=false;
async function seedAll(replace){
  const D=demoData();
  if(!live){enterDemo();return}
  if(seeding)return;seeding=true;
  const jobs=[];if(replace)for(const c of COLS)for(const id of Object.keys(S[c]))if(!D[c][id])jobs.push(()=>db.collection(c).doc(id).delete());
  for(const c of COLS)for(const id of Object.keys(D[c]))jobs.push(()=>db.collection(c).doc(id).set(D[c][id]));
  let done=0;const show=()=>{$("#banner").innerHTML=`<div class="banner"><b>Loading demo data…</b> ${done} of ${jobs.length} records. Keep this tab open.</div>`};show();
  const run=async job=>{for(let k=0;k<5;k++){try{await job();return}catch(e){if(e&&(e.code==="resource_exhausted"||e.code==="unavailable")){await new Promise(r=>setTimeout(r,1500*2**k));continue}throw e}}throw new Error("The database is busy. Press Load demo data again in a minute.")};
  try{let i=0;await Promise.all([...Array(6)].map(async()=>{while(i<jobs.length){const j=jobs[i++];await run(j);done++;if(done%10===0)show()}}));toast("Demo data loaded")}
  catch(e){toast(e.code==="invalid_argument"?"You have view-only access, so demo data cannot be loaded.":(e.message||String(e)))}
  finally{seeding=false;setBanner()}
}
function demoData2(){const D=demoData();try{for(const a of JSON.parse(localStorage.getItem("vx-answers")||"[]")){const n=Object.keys(D.knowledge).length+1;D.knowledge["KB-"+n]=a}}catch(_){}return D}
function enterDemo(){localFlush();demo=true;const D=demoData2();COLS.forEach(c=>S[c]=D[c]);modeChip();setBanner();render();toast("Demo is on: test data, nothing is saved")}
function exitDemo(){demo=false;const L=localLoad();COLS.forEach(c=>S[c]=L[c]);modeChip();setBanner();render();toast("Demo is off: your own data is back")}
function modeChip(){const m=$("#modeChip"),b=$("#demoBtn");if(live){m.textContent="Live database";b.hidden=true;return}
  m.textContent=demo?"Demo · not saved":"Saved in this browser";b.hidden=false;b.textContent=demo?"Exit demo":"Demo";b.classList.toggle("primary",demo)}
document.addEventListener("click",e=>{if(e.target.closest("#demoBtn"))demo?exitDemo():enterDemo()});
function setBanner(){
  const b=$("#banner");
  if(!live&&demo){b.innerHTML=`<div class="banner"><span><b>Demo for testing.</b> This is the sample barbershop. Nothing here is saved, Telegram chats included, and your own data is untouched. <button class="btn sm" data-exitdemo>Exit demo</button></span></div>`;return}
  if(!live){b.innerHTML=Object.keys(S.services).length?"":`<div class="banner"><span><b>Your CRM is empty.</b> Fill in Business setup, then add services and staff: VoroniX AI answers clients from them. Everything is saved in this browser. <button class="btn sm" data-setupnow>Business setup</button> <button class="btn sm" data-loaddemo>Try the demo</button></span></div>`;return}
  if(seeding)return;
  if(loaded.size===COLS.length&&!Object.keys(S.services).length){b.innerHTML=`<div class="banner"><b>The database is empty.</b> Load the demo barbershop (services, staff, 30 clients, 6 weeks of bookings, sample chats) to try the CRM.${canWrite?' <button class="btn create sm" data-loaddemo>Load demo data</button>':""}</div>`;return}
  b.innerHTML="";
}
document.addEventListener("click",e=>{if(e.target.closest("[data-loaddemo]"))seedAll(false);if(e.target.closest("[data-exitdemo]"))exitDemo();if(e.target.closest("[data-setupnow]"))location.hash="business"});
function tick(){const n=new Date();$("#clock").textContent=DOW[n.getDay()]+" "+hm(n)}
setInterval(tick,30000);tick();
(async function boot(){
  const h=location.hash.slice(1);if(PAGES[h])route=h;
  const C=window.claude;
  brainStart().then(()=>{let t="";try{t=localStorage.getItem(TG_KEY)||""}catch(_){}if(t)tgStart(t)});
  const offline=()=>{const L=localLoad();COLS.forEach(c=>S[c]=L[c]);modeChip();fromAiSite()};
  if(!(C&&C.use)){offline();setBanner();render();return}
  render();
  const [dbx,ux]=C&&C.use?await Promise.all([C.use("db"),C.use("user")]):[null,null];
  if(ux){try{const w=await ux.can("data.write");if(w===false)canWrite=false}catch(_){}}
  if(dbx){db=dbx;live=true;modeChip();
    for(const c of COLS){db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{if(!deleting[c+"/"+d.id])o[d.id]=d.data()});for(const id in S[c])if(inflight[c+"/"+id]>0)o[id]=S[c][id];S[c]=o;loaded.add(c);setBanner();scheduleRender()},err=>toast("Database error: "+err.message))}
  }else{offline();setBanner();render()}
})();
</script>
